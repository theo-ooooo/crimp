name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.d.outputs.api }}
      app: ${{ steps.d.outputs.app }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          [[ -f api/build.gradle.kts || -f api/build.gradle ]] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          [[ -f app/package.json ]] && echo "app=true" >> "$GITHUB_OUTPUT" || echo "app=false" >> "$GITHUB_OUTPUT"
          [[ -f web/package.json ]] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  api:
    name: API (Spring Boot)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check
        working-directory: api
        run: gradle check --no-daemon

  app:
    name: App (React Native)
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: app
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: app
        run: pnpm typecheck
      - name: Test
        working-directory: app
        run: pnpm test -- --ci --passWithNoTests

  web:
    name: Web (Next.js)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: web
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

  ci:
    name: ci
    needs: [detect, api, app, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        shell: bash
        run: |
          echo "detect: ${{ needs.detect.result }}"
          echo "api: ${{ needs.api.result }}"
          echo "app: ${{ needs.app.result }}"
          echo "web: ${{ needs.web.result }}"
          if [[ "${{ needs.detect.result }}" == "failure" ]]; then
            echo "::error::detect job failed"; exit 1
          fi
          for r in "${{ needs.api.result }}" "${{ needs.app.result }}" "${{ needs.web.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::a required job failed or was cancelled"; exit 1
            fi
          done
          echo "all stacks pass (skipped stacks treated as OK)"
