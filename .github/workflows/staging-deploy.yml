name: Staging — API deploy (Fly.io)

# develop 브랜치에 push (PR 머지 포함) 되면 staging 자동 배포.
# api/ 또는 의존 모듈 변경시에만 트리거 — 무관한 web/app PR 의 불필요한 배포 회피.
on:
  push:
    branches: [develop]
    paths:
      - 'api/**'
      - '.github/workflows/staging-deploy.yml'
  # 수동 트리거 (예: 시크릿 갱신 후 재배포).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 시점에 두 배포가 겹치지 않도록 — 진행 중 배포는 취소하고 최신만.
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy crimp-api-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # FLY_API_TOKEN — Settings > Secrets 에 등록 필요.
      # 토큰 발급:  flyctl auth token  (또는 organization deploy token 권장)
      - name: Deploy
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --strategy rolling \
            --wait-timeout 300
