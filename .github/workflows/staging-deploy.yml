name: Staging — API deploy (Fly.io)

# develop 브랜치에 push (PR 머지 포함) 되면 staging 자동 배포.
# api/ 또는 의존 모듈 변경시에만 트리거 — 무관한 web/app PR 의 불필요한 배포 회피.
on:
  push:
    branches: [develop]
    paths:
      - 'api/**'
      - '.github/workflows/staging-deploy.yml'
  # 수동 트리거 (예: 시크릿 갱신 후 재배포).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 시점에 두 배포가 겹치지 않도록 큐잉. 진행 중 배포는 그대로 두고 다음 push 는 줄 세움.
  # (PR #114 리뷰 I2) 이전엔 cancel-in-progress=true 였는데, rolling 배포 중간 SIGTERM
  # 으로 부분 교체 상태가 발생할 수 있어 false 로 변경. 큐 길이는 GitHub 가 마지막 1건만
  # 보존하는 것이 기본이라 짧은 간격 push 들이 쌓여도 마지막 deploy 가 최종 상태가 됨.
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy crimp-api-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # FLY_API_TOKEN — Settings > Secrets 에 등록 필요.
      # 토큰 발급:  flyctl auth token  (또는 organization deploy token 권장)
      - name: Deploy
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --strategy rolling \
            --wait-timeout 300
