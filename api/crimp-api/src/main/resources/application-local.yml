# local 프로파일 전용 오버라이드.
# Flyway 시드 (dev 데이터) 를 함께 로드.

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev
    # 로컬 DB 에 상위 버전만 먼저 적용된 뒤 하위 마이그레이션 파일이 생긴 경우(브랜치 전환 등) pending 적용 허용.
    # 스테이징/운영은 기본(false) — 마이그레이션은 항상 시간순으로 배포한다.
    out-of-order: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE

# 로컬 개발 편의 — 모든 오리진 허용 (ngrok / cloudflared 같은 임시 도메인 + iOS sim
# 의 file:// 등). allowedOrigins=[] 로 비우고 allowedOriginPatterns=['*'] 사용 —
# Spring 의 CorsConfiguration 이 wildcard origin + credentials=true 조합을
# allowedOriginPatterns 에서만 허용 (Access-Control-Allow-Credentials 헤더 동시 사용).
# 운영 환경 (application.yml) 은 명시 origin 목록 그대로 사용 — 이 override 는 'local' profile 한정.
crimp:
  cors:
    allowed-origins: []
    allowed-origin-patterns:
      - "*"
