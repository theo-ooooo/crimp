# staging 프로파일 — Fly.io 배포용 오버라이드.
#
# 모든 자격증명/외부 URL 은 환경 변수로 주입 (Fly secrets). 운영(prod) 도 거의 동일한
# 구조라 이 파일을 복사해 application-prod.yml 로 분기 가능.
#
# 필수 시크릿 체크리스트는 docs/운영/staging-deploy.md 참조.

spring:
  jpa:
    # staging 은 prod 와 동일 — DDL 변경은 Flyway 만 통해.
    hibernate:
      ddl-auto: validate
  datasource:
    # MySQL 8 self-host on Fly Machine. Fly internal DNS 의 6PN 주소 사용 —
    # 같은 organization 의 다른 app (`crimp-mysql-staging.internal`) 으로 통신.
    # - useSSL=false: 동일 organization 내부 트래픽만 허용되므로 외부 노출 없음.
    # - allowPublicKeyRetrieval=true: MySQL 8 의 caching_sha2_password 핸드셰이크 시
    #   Connector/J 가 서버 RSA public key 를 받아오도록 허용. SSL 사용 안 하는
    #   internal 6PN 환경에서 필수 (없으면 첫 부팅 Flyway 가 'Public Key Retrieval
    #   is not allowed' 로 실패).
    #
    # (PR #114 리뷰 I3 — follow-up): 6PN 자체 방어로 평문 통신 자체는 안전하지만, 운영 단계
    # 진입 전 다음 둘 중 하나로 보강 권장:
    #   1) Fly 6PN 노드 간 TLS 활성화 후 useSSL=true&requireSSL=true&verifyServerCertificate=true
    #   2) MySQL 측 default_authentication_plugin=mysql_native_password 으로 caching_sha2 의존 제거
    # staging 한정 임시 설정 — prod 는 매니지드 DB (RDS/PlanetScale) 권장이라 본 옵션 자체 불필요.
    url: ${DB_URL:jdbc:mysql://crimp-mysql-staging.internal:3306/crimp?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:crimp}
    password: ${DB_PASSWORD}
    hikari:
      # staging 은 동시 사용자 적음 — pool 줄여 메모리 절약.
      maximum-pool-size: 5
  data:
    redis:
      # Upstash Redis (TLS 필수). 호스트·포트·패스워드는 시크릿으로 주입.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      # (PR #115 후속) 헬스체크/연결 양쪽 timeout — Upstash TLS 핸드셰이크가 14s 까지
      # 늘어지는 케이스가 있어 actuator 가 행 → Fly 헬스체크 5s grace 초과로 머신
      # unhealthy 처리 → PR03. 짧게 잡고 빨리 실패시켜 보호.
      timeout: 2000ms
      connect-timeout: 2000ms

server:
  port: 8080
  # Fly proxy 뒤에서 X-Forwarded-* 신뢰 — secure cookie / scheme 정확 인식.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # staging 은 health/info/prometheus 만 — 추가 엔드포인트 노출은 prod 검토 후.
        include: health,info,prometheus
  # (PR #115 후속) Redis 헬스 컨트리뷰터 비활성화 — Upstash 응답 지연이 actuator/health
  # 에 전이되면 Fly 헬스체크 5s 안에 응답을 못 줘 머신이 unhealthy 로 빠진다. Redis 자체
  # 장애는 RefreshTokenStore 호출에서 직접 검출되므로 health 엔드포인트가 Redis 의 가용성을
  # 책임질 필요 없음. prod 는 매니지드 Redis 라 다시 켤지 별도 검토.
  health:
    redis:
      enabled: false

crimp:
  cors:
    # 환경 변수로 콤마 구분 origin 주입 (`https://staging.crimp.app,https://app-staging.crimp.app`).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # 와일드카드 미사용 — staging 도 명시 origin 목록만.
    allowed-origin-patterns: ""

app:
  auth:
    cookie:
      # staging 은 HTTPS 만 — 평문 노출 차단 (PR #94 리뷰 S3).
      secure: true
      domain: ${AUTH_COOKIE_DOMAIN}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  media:
    # Cloudflare R2 — S3-compatible. endpoint-url + path-style 로 지정.
    # bucket / region / access-key / secret-key 는 R2 콘솔에서 발급한 값을 시크릿으로.
    cdn-base-url: ${CDN_BASE_URL:}
    s3:
      bucket: ${S3_BUCKET}
      # R2 는 region 무관이지만 SDK 가 빈 값을 거부 — 관용적으로 'auto' 사용.
      region: auto
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      # Cloudflare R2 endpoint: https://<account_id>.r2.cloudflarestorage.com
      endpoint-url: ${S3_ENDPOINT_URL}
      path-style-access-enabled: true

logging:
  level:
    root: INFO
    io.crimp: INFO
    # staging 트러블슈팅 시에만 임시 DEBUG 로 — Fly 로그 비용 고려.
