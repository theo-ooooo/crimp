spring:
  application:
    name: crimp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/crimp?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USER:crimp}
    password: ${DB_PASSWORD:crimp}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 1500000
      leak-detection-threshold: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  brand: Crimp
  env: ${SPRING_PROFILES_ACTIVE:local}
  auth:
    jwt:
      # 로컬 개발 기본값. 운영에서는 Secrets Manager 환경 변수로 주입.
      secret: ${JWT_SECRET:crimp-local-development-secret-please-change-in-production-32bytes+}
      access-ttl-seconds: 900
      refresh-ttl-seconds: 1209600
      issuer: https://crimp.local
    oauth:
      kakao:
        client-id: ${KAKAO_CLIENT_ID:placeholder-kakao-client-id}
        issuer: https://kauth.kakao.com
        jwks-uri: https://kauth.kakao.com/.well-known/jwks.json

logging:
  level:
    root: INFO
    io.crimp: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
