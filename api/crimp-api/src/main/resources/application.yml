spring:
  application:
    name: crimp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/crimp?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USER:crimp}
    password: ${DB_PASSWORD:crimp}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 1500000
      leak-detection-threshold: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

crimp:
  cors:
    # 환경 변수로 콤마 구분 오리진 전달 가능. 기본값은 로컬 개발 포트.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:19006}
    allowed-methods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
    allowed-headers: ["*"]
    exposed-headers: []
    # HttpOnly 쿠키 인증을 쓰려면 필수 (PR #94). 클라는 fetch credentials: 'include' 사용.
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: 3600

app:
  brand: Crimp
  env: ${SPRING_PROFILES_ACTIVE:local}
  auth:
    jwt:
      # 로컬 개발 기본값. 운영에서는 Secrets Manager 환경 변수로 주입.
      secret: ${JWT_SECRET:crimp-local-development-secret-please-change-in-production-32bytes+}
      access-ttl-seconds: 900
      refresh-ttl-seconds: 1209600
      issuer: https://crimp.local
    oauth:
      kakao:
        # OIDC ID Token 검증 (모바일/JS SDK 가 직접 발급한 id_token)
        # client-id 는 모바일 네이티브 앱 키. id_token 의 aud 는 SDK 초기화에 쓴 키와
        # 동일하게 박히므로 웹 code flow(REST 키)·기타 클라이언트(JS 키)도 함께 허용해야
        # 한다. rest-api-key 는 자동으로 audience 집합에 포함되며, 그 외 키는
        # additional-audiences 에 콤마로 나열한다 (예: KAKAO_ADDITIONAL_AUDIENCES=js-key,...)
        client-id: ${KAKAO_CLIENT_ID:placeholder-kakao-client-id}
        additional-audiences: ${KAKAO_ADDITIONAL_AUDIENCES:}
        issuer: https://kauth.kakao.com
        jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
        # Authorization Code 교환 (웹 v2 redirect flow — 서버가 /oauth/token 호출)
        # rest-api-key 가 비어 있으면 /auth/oauth/kakao/code 엔드포인트는
        # KAKAO_OAUTH_NOT_CONFIGURED (503) 으로 응답한다.
        rest-api-key: ${KAKAO_REST_API_KEY:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      # Apple Sign In (PR #102, F-D1) — OIDC ID Token 검증.
      # client-id 는 보통 iOS 앱 번들 ID. 웹 Service ID 는 별도 audience 라
      # additional-audiences 에 콤마로 추가 (예: APPLE_ADDITIONAL_AUDIENCES=services.crimp.web,...).
      # placeholder 값일 때도 verifier 빈은 등록되며 실 검증은 운영 시 환경 변수로 주입.
      # 추후 PR (D2 이후) 에서 Apple 의 authorization_code 교환 (client_secret JWT 생성) 추가 예정.
      apple:
        client-id: ${APPLE_CLIENT_ID:placeholder-apple-client-id}
        additional-audiences: ${APPLE_ADDITIONAL_AUDIENCES:}
        issuer: https://appleid.apple.com
        jwks-uri: https://appleid.apple.com/auth/keys
      # Google Sign In (PR #103, F-D2) — OIDC ID Token 검증.
      # client-id 는 platform 별로 다름 (iOS / Android / Web). RN google-signin 은
      # 양 플랫폼이 webClientId 로 id_token 을 받는 경우가 많아 web client id 를
      # client-id 로 박고, 네이티브 client id 가 별도로 사용되면 additional-audiences
      # 에 추가 (예: GOOGLE_ADDITIONAL_AUDIENCES=ios.googleusercontent.com,...)
      google:
        client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
        additional-audiences: ${GOOGLE_ADDITIONAL_AUDIENCES:}
        issuer: https://accounts.google.com
        jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    # HttpOnly 쿠키 발급 설정 (PR #94, HttpOnly 전환). 웹은 본 쿠키로 토큰 보유, 모바일은
    # 쿠키 무시하고 JSON body 의 토큰 사용 (둘 다 발행).
    #
    # 운영 배포 시 반드시 (PR #94 리뷰 S3 — 평문 전송 방지):
    #   AUTH_COOKIE_SECURE=true   (HTTPS 전용 — 미설정 시 쿠키가 평문 노출됨)
    #   AUTH_COOKIE_DOMAIN=.crimp.app   (서브도메인 공유)
    #   AUTH_COOKIE_SAME_SITE=Lax (또는 cross-site 시나리오면 None — 그 경우 SECURE=true 가 필수,
    #                              app 시작 시 AuthCookieProperties 가 검증 실패로 차단)
    cookie:
      domain: ${AUTH_COOKIE_DOMAIN:}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      access-name: crimp_access
      refresh-name: crimp_refresh
  # 미디어 업로드 (S3 presigned PUT) — PR #90, F5 카메라 캡처 인프라.
  # 자격증명 우선순위: profile > access-key/secret-key > default credential chain.
  # 로컬 개발: AWS_PROFILE 환경변수에 ~/.aws/credentials 의 named profile 이름 설정.
  # 운영 ECS: 셋 다 비우고 Task Role 의 default credential chain 사용.
  media:
    cdn-base-url: ${CDN_BASE_URL:}
    presigned-url-ttl-seconds: ${MEDIA_PRESIGN_TTL:600}
    s3:
      bucket: ${S3_BUCKET:crimp-media-local}
      region: ${AWS_REGION:ap-northeast-2}
      profile: ${AWS_PROFILE:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
  # Gym sync — 외부 위치 검색 어댑터 (Kakao Local API).
  # 본 설정은 어댑터 동작 파라미터만 담는다. REST API 키는 위 oauth.kakao.rest-api-key 재사용.
  gym-sync:
    kakao-local:
      base-url: https://dapi.kakao.com
      keyword-search-path: /v2/local/search/keyword.json
      # 한 번의 호출에서 검색할 반경(미터) — Kakao 상한 20km. 클라이밍 매장 밀도상 5km 권장.
      default-radius-meters: 5000
      # 매장 검색 키워드 — Kakao Local 의 카테고리(SP1) 매핑이 없어 한글 키워드로 검색.
      query-keyword: 클라이밍
      # 한 호출당 응답 사이즈 (Kakao 상한 15) 와 페이지네이션 한도 — 한 좌표에서 최대 45건.
      page-size: 15
      max-pages: 3

logging:
  level:
    root: INFO
    io.crimp: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
