spring:
  application:
    name: crimp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/crimp?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USER:crimp}
    password: ${DB_PASSWORD:crimp}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 1500000
      leak-detection-threshold: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  brand: Crimp
  env: ${SPRING_PROFILES_ACTIVE:local}
  auth:
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600
    jwt-issuer: https://crimp.local
  media:
    s3-bucket: ${S3_BUCKET:crimp-media-dev}
    cdn-base-url: ${CDN_BASE:https://dev-cdn.crimp.local}
    presigned-url-ttl-seconds: 600

logging:
  level:
    root: INFO
    io.crimp: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
